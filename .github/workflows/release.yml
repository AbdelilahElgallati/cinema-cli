name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build Binary
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --onefile cli/main.py --name cinema-cli
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinema-cli-${{ matrix.os }}
          path: dist/cinema-cli*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare dist
        run: |
          mkdir dist
          # Find and copy binaries with descriptive names
          find artifacts -name "cinema-cli" -type f | grep ubuntu | xargs -I{} cp {} dist/cinema-cli-linux
          find artifacts -name "cinema-cli" -type f | grep macos | xargs -I{} cp {} dist/cinema-cli-macos
          find artifacts -name "cinema-cli.exe" -type f | xargs -I{} cp {} dist/cinema-cli-windows.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cinema-cli-linux
            dist/cinema-cli-macos
            dist/cinema-cli-windows.exe
          draft: true
          generate_release_notes: true
